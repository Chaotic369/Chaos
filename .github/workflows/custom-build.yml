name: Build Native Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name (shown under the launcher icon)"
        required: false
        default: "Chaos"
        type: string
      app_version:
        description: "App version (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.inputs.app_name || 'Chaos' }}
      APP_VERSION: ${{ github.event.inputs.app_version || '1.0.0' }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
              uses: gradle/actions/setup-gradle@v4
              with:
                gradle-version: "8.9"

      - name: Locate Android project
        run: |
          echo "--- repo layout ---"
          find . -maxdepth 5 \( -name .git -o -name node_modules -o -name build -o -name .gradle \) -prune -o -print | sort | head -150
          python3 - <<'PY'
          import os, sys

          SKIP = {"build", ".git", "node_modules", ".gradle"}

          def gradle_file(module):
              for n in ("build.gradle.kts", "build.gradle"):
                  p = os.path.join(module, n)
                  if os.path.isfile(p):
                      return p
              return None

          def is_app(gf):
              with open(gf, encoding="utf-8", errors="ignore") as f:
                  t = f.read()
              return "com.android.application" in t or "android.application" in t

          modules = []
          for d, dirs, files in os.walk("."):
              dirs[:] = [x for x in dirs if x not in SKIP]
              if "AndroidManifest.xml" in files and d.replace("\\", "/").endswith("src/main"):
                  modules.append(os.path.normpath(os.path.join(d, "..", "..")))

          cands = [m for m in modules if gradle_file(m) and is_app(gradle_file(m))]
          if not cands:
              cands = [m for m in modules if gradle_file(m)]
          if not cands:
              print("ERROR: no Android module (src/main/AndroidManifest.xml + build.gradle[.kts]) found. See layout above.")
              sys.exit(1)

          cands.sort(key=lambda m: (not m.replace("\\", "/").startswith("wrapper"), len(m)))
          print("Candidates:", cands)
          module = cands[0]

          root = module
          while True:
              if any(os.path.isfile(os.path.join(root, n)) for n in ("settings.gradle.kts", "settings.gradle")):
                  break
              if root in (".", ""):
                  break
              root = os.path.dirname(root) or "."
          if not any(os.path.isfile(os.path.join(root, n)) for n in ("settings.gradle.kts", "settings.gradle")):
              print("WARNING: settings.gradle[.kts] not found, using repo root")
              root = "."

          manifest = os.path.join(module, "src/main/AndroidManifest.xml")
          gf = gradle_file(module)
          print("APP_DIR=%s PROJECT_ROOT=%s MANIFEST=%s GRADLE_FILE=%s" % (module, root, manifest, gf))
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_DIR=%s\nPROJECT_ROOT=%s\nMANIFEST=%s\nGRADLE_FILE=%s\n" % (module, root, manifest, gf))
          PY

      - name: Patch app name and version
        run: |
          python3 - <<'PY'
          import os, re

          name = os.environ["APP_NAME"]
          ver = os.environ["APP_VERSION"]
          run_number = int(os.environ.get("RUN_NUMBER", "1") or "1")

          # ---- Manifest: android:label on the <application> tag ----
          mp = os.environ["MANIFEST"]
          with open(mp, encoding="utf-8") as f:
              s = f.read()
          safe = (name.replace("&", "&amp;").replace('"', "&quot;")
                      .replace("<", "&lt;").replace(">", "&gt;"))

          def fix_app(m):
              tag = m.group(0)
              if re.search(r'android:label="[^"]*"', tag):
                  return re.sub(r'android:label="[^"]*"',
                                lambda _m: 'android:label="%s"' % safe, tag, count=1)
              return tag.replace("<application", '<application android:label="%s"' % safe, 1)

          s, n = re.subn(r"<application\b[^>]*>", fix_app, s, count=1)
          if n == 0:
              raise SystemExit("ERROR: <application> tag not found in " + mp)
          with open(mp, "w", encoding="utf-8") as f:
              f.write(s)

          # ---- build.gradle(.kts): versionName / versionCode ----
          parts = [int(x) for x in re.findall(r"\d+", ver)[:3]]
          while len(parts) < 3:
              parts.append(0)
          code = parts[0] * 10000 + parts[1] * 100 + parts[2]
          if code <= 0:
              code = run_number
          vname = (ver.replace("\\", "\\\\").replace('"', '\\"').replace("$", "\\$"))

          gp = os.environ["GRADLE_FILE"]
          with open(gp, encoding="utf-8") as f:
              g = f.read()
          g, n1 = re.subn(r'versionName(\s*=?\s*)"[^"]*"',
                          lambda m: 'versionName%s"%s"' % (m.group(1), vname), g, count=1)
          g, n2 = re.subn(r"versionCode(\s*=?\s*)\d+",
                          lambda m: "versionCode%s%d" % (m.group(1), code), g, count=1)
          if n1 == 0 or n2 == 0:
              raise SystemExit("ERROR: versionName/versionCode not found in " + gp)
          with open(gp, "w", encoding="utf-8") as f:
              f.write(g)

          print("Patched label=%r versionName=%r versionCode=%d" % (name, ver, code))
          PY

      - name: Inject launcher icon from build-icon.png
        if: ${{ hashFiles('build-icon.png') != '' }}
        run: |
          python3 -m pip install pillow || python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image, ImageDraw, ImageOps

          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          res = os.path.join(os.environ["APP_DIR"], "src/main/res")
          src = Image.open("build-icon.png").convert("RGBA")

          # Remove existing launcher icons so resources do not clash (adaptive xml, webp, png)
          for d in glob.glob(os.path.join(res, "mipmap*")):
              for fn in os.listdir(d):
                  stem = os.path.splitext(fn)[0]
                  if stem in ("ic_launcher", "ic_launcher_round"):
                      os.remove(os.path.join(d, fn))

          for density, px in sizes.items():
              out_dir = os.path.join(res, "mipmap-" + density)
              os.makedirs(out_dir, exist_ok=True)
              icon = ImageOps.fit(src, (px, px), Image.LANCZOS)
              icon.save(os.path.join(out_dir, "ic_launcher.png"))

              mask = Image.new("L", (px * 4, px * 4), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, px * 4 - 1, px * 4 - 1), fill=255)
              mask = mask.resize((px, px), Image.LANCZOS)
              round_icon = Image.new("RGBA", (px, px), (0, 0, 0, 0))
              round_icon.paste(icon, (0, 0), mask)
              round_icon.save(os.path.join(out_dir, "ic_launcher_round.png"))

          print("Icon injected into", res)
          PY

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name || 'Chaos' }}
          path: ${{ env.APP_DIR }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error